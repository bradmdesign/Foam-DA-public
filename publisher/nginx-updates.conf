# Add inside the EXISTING HTTPS server block for beardog.games, then nginx -t.
# Create this directory with ownership for the SSH publishing user first.
# This snippet does not replace the site's server configuration.
location ^~ /foam-da/updates/ {
    alias /var/www/foam-da-updates/;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    limit_except GET HEAD { deny all; }
}
